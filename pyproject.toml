[project]
name = "codex2api-image"
version = "0.4.0"
description = "API-key-only CLI for local codex2api image endpoints."
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3.0,<13"]

[project.scripts]
codex2api-image = "codex2api_image.cli:main"

[dependency-groups]
dev = ["pyright>=1.1.413"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.uv]
package = true
